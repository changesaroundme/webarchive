<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- Fonts the civic sites ask for that a Linux container does not have.
       Without these, "Avenir Next" (ArcGIS Experience Builder) falls to the
       very wide DejaVu Sans, headings wrap onto extra lines and overlap the
       fixed-height blocks below them. -->
  <alias binding="same"><family>Avenir Next</family><prefer><family>Lato</family></prefer></alias>
  <alias binding="same"><family>Avenir</family><prefer><family>Lato</family></prefer></alias>
  <alias binding="same"><family>Avenir Next LT Pro</family><prefer><family>Lato</family></prefer></alias>
  <alias binding="same"><family>Helvetica Neue</family><prefer><family>Liberation Sans</family></prefer></alias>
  <alias binding="same"><family>Helvetica</family><prefer><family>Liberation Sans</family></prefer></alias>
  <alias binding="same"><family>Arial</family><prefer><family>Liberation Sans</family></prefer></alias>
  <alias binding="same"><family>Segoe UI</family><prefer><family>Lato</family></prefer></alias>
  <alias><family>sans-serif</family><prefer><family>Liberation Sans</family></prefer></alias>
</fontconfig>
